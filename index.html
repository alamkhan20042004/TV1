<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Channels</title>
    <style>
        /* Basic Styling */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1115;
            color: white;
        }

        /* Header & Search Bar */
        .header {
            padding: 20px;
            background-color: #1a1d24;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 2px solid #e50914;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .header h1 {
            margin: 0;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .search-container {
            width: 100%;
            max-width: 500px;
        }
        #search-bar {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #0f1115;
            color: white;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        #search-bar:focus {
            border-color: #e50914;
        }

        /* Container */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Grid Layout */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Channel Card Design */
        .channel-card {
            background: linear-gradient(145deg, #1e222b, #15181e);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #2a2e38;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }
        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.2);
            border-color: #e50914;
        }

        .channel-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            background-color: white;
            border-radius: 8px;
            padding: 5px;
        }

        .channel-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-online { background-color: #28a745; color: white; }
        .status-offline { background-color: #dc3545; color: white; }

        /* Player Screen */
        #player-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 1000;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            background-color: black;
        }

        /* Error/Loading Text */
        #message {
            text-align: center;
            margin-top: 50px;
            font-size: 18px;
            color: #ffca28;
        }
    </style>
</head>
<body>

    <div id="main-view">
        <div class="header">
            <h1>Live TV Channels</h1>
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Search for a channel..." oninput="filterChannels()">
            </div>
        </div>

        <div class="container">
            <div id="message">Loading data from data.json...</div>
            <div id="channels-container" class="channel-grid"></div>
        </div>
    </div>

    <div id="player-screen">
        <iframe id="tv-player" allowfullscreen scrolling="no"></iframe>
    </div>

<script>
    let allChannels = []; 

    document.addEventListener('DOMContentLoaded', fetchLocalData);

    // Jab URL ka hash change ho (ya user back/forward button dabaye)
    window.addEventListener('hashchange', checkHashForPlayer);

    async function fetchLocalData() {
        const messageDiv = document.getElementById('message');

        try {
            const response = await fetch('./data.json');
            
            if (!response.ok) {
                throw new Error("Could not find data.json");
            }

            const data = await response.json();
            
            if (data && data.channels) {
                allChannels = data.channels;
                messageDiv.style.display = 'none'; 
                renderChannels(allChannels);

                // Data load hone ke baad check karo ke direct link toh open nahi kiya?
                checkHashForPlayer();
            } else {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Error: Invalid data format in data.json";
            }

        } catch (error) {
            console.error("Fetch Error:", error);
            messageDiv.style.color = "#ff4444";
            messageDiv.innerHTML = `
                <b>Error loading data.json</b><br><br>
                Make sure your file is named exactly <code>data.json</code>.
            `;
        }
    }

    // Channels ko screen par dikhana
    function renderChannels(channelsToRender) {
        const container = document.getElementById('channels-container');
        container.innerHTML = ''; 

        if (channelsToRender.length === 0) {
            container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #aaa;">No channels found.</div>';
            return;
        }

        channelsToRender.forEach(channel => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            
            // Yahan hum openPlayer ko URL pass kar rahe hain
            card.onclick = () => openPlayer(channel.url);

            const imgSrc = channel.image ? channel.image : 'https://via.placeholder.com/80x80?text=No+Logo';
            const isOnline = channel.status.toLowerCase() === 'online';
            const statusClass = isOnline ? 'status-online' : 'status-offline';

            card.innerHTML = `
                <img src="${imgSrc}" class="channel-logo" onerror="this.src='https://via.placeholder.com/80x80?text=Logo'">
                <div class="channel-name">${channel.name}</div>
                <div class="status-badge ${statusClass}">${channel.status}</div>
            `;

            container.appendChild(card);
        });
    }

    // Search Bar Logic
    function filterChannels() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const filteredData = allChannels.filter(channel => {
            return channel.name.toLowerCase().includes(query);
        });
        renderChannels(filteredData);
    }

    // NAYA SYSTEM: Deep Linking Player Setup
    function openPlayer(streamUrl) {
        // Stream URL ko encode karke browser ke URL mein daal do
        const encodedUrl = btoa(streamUrl); // Base64 encoding
        window.location.hash = 'play=' + encodedUrl; 
        // Hash change hone par checkHashForPlayer() auto-run ho jayega
    }

    function closePlayerUI() {
        // URL se hash khatam kar do taake wapas home page par aa jaye
        history.pushState("", document.title, window.location.pathname + window.location.search);
        
        document.getElementById('player-screen').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('tv-player').src = "";
    }

    // Yeh function check karega ke URL mein koi video play karne ka link hai ya nahi
    function checkHashForPlayer() {
        const hash = window.location.hash;
        
        // Agar URL mein '#play=' mojood hai
        if (hash.startsWith('#play=')) {
            try {
                // Base64 ko wapas original URL mein convert karo
                const encodedUrl = hash.replace('#play=', '');
                const streamUrl = atob(encodedUrl); 

                // Player show karo aur stream chalao
                document.getElementById('main-view').style.display = 'none';
                const playerScreen = document.getElementById('player-screen');
                const iframe = document.getElementById('tv-player');
                
                playerScreen.style.display = 'block';
                iframe.src = streamUrl; 
            } catch (e) {
                console.error("Invalid stream link");
                closePlayerUI(); // Link kharab ho toh wapas home par bhej do
            }
        } else {
            // Agar normal URL hai toh home page show karo
            document.getElementById('player-screen').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            document.getElementById('tv-player').src = "";
        }
    }
</script>
</body>
</html>
