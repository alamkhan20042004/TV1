<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Channels</title>
    <style>
        /* Basic Styling */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
        }

        /* Header & Search Bar */
        .header {
            padding: 20px;
            background-color: #1e1e1e;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header h1 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }
        .search-box {
            width: 80%;
            max-width: 500px;
            padding: 10px 15px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 16px;
            background-color: #333;
            color: white;
        }
        .search-box::placeholder {
            color: #bbb;
        }

        /* Channel Sections */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-top: 30px;
            color: #ddd;
        }

        /* Grid Layout for Channels */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Channel Cards */
        .channel-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
        .channel-image {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
            background-color: #000;
            border-radius: 5px;
        }
        .channel-name {
            font-size: 15px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        /* Badges Container */
        .badges-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        /* Generic Badge Style */
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-online { background-color: #28a745; color: white; }
        .status-offline { background-color: #dc3545; color: white; }
        .country-badge { background-color: #007bff; color: white; }
        .viewers-badge { background-color: #6c757d; color: white; }

        /* Player Screen */
        #player-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 1000;
        }
        
        /* Iframe takes full screen, no buttons above it */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            background-color: black;
        }

        /* Loading Text */
        #loading {
            text-align: center;
            margin-top: 50px;
            font-size: 18px;
            color: #ffca28;
        }
    </style>
</head>
<body>

    <div id="main-view">
        <div class="header">
            <h1>Live TV Streaming</h1>
            <input type="text" id="searchInput" class="search-box" placeholder="Search channels (e.g. Willow)..." onkeyup="handleSearch()">
        </div>

        <div class="container">
            <div id="loading">Fetching live channels data, please wait...</div>
            
            <h2 class="section-title" id="online-title" style="display: none;">🟢 Online Channels</h2>
            <div id="online-grid" class="channel-grid"></div>

            <h2 class="section-title" id="offline-title" style="display: none;">🔴 Offline Channels</h2>
            <div id="offline-grid" class="channel-grid"></div>
        </div>
    </div>

    <div id="player-screen">
        <iframe id="tv-player" allowfullscreen scrolling="no"></iframe>
    </div>

    <script>
        const TARGET_API = "https://api.cdnlivetv.tv/api/v1/channels/?user=cdnlivetv&plan=free";
        
        // Do proxies ka setup kiya hai, ek fail ho toh dusri chal jaye
        const PROXY_1 = `https://corsproxy.io/?${encodeURIComponent(TARGET_API)}`;
        const PROXY_2 = `https://api.allorigins.win/raw?url=${encodeURIComponent(TARGET_API)}`;
        
        let allChannels = [];

        document.addEventListener('DOMContentLoaded', fetchChannels);

        // History API Listener: Yeh browser ke back button ko handle karta hai
        window.addEventListener('popstate', function(event) {
            if (!event.state || event.state.view !== 'player') {
                closePlayerUI();
            }
        });

        async function fetchChannels() {
            const loadingDiv = document.getElementById('loading');
            let response, data;

            try {
                // Pehlay Proxy 1 try karega
                response = await fetch(PROXY_1);
                if (!response.ok) throw new Error("Proxy 1 failed");
                data = await response.json();
            } catch (error1) {
                console.log("Proxy 1 down, trying Proxy 2...");
                try {
                    // Agar Proxy 1 down hai toh Proxy 2 try karega (raw format mein)
                    response = await fetch(PROXY_2);
                    if (!response.ok) throw new Error("Proxy 2 failed");
                    data = await response.json();
                } catch (error2) {
                    console.error("Both proxies failed");
                    loadingDiv.style.color = "#ff4444"; 
                    loadingDiv.innerText = "Error: Data load nahi ho raha. Proxies temporarily down hain, thori dair baad try karein.";
                    return;
                }
            }

            // Data mil gaya, ab channels nikalte hain aapke diye hue code logic ke mutabiq
            if(data && data.channels) {
                allChannels = data.channels;
                loadingDiv.style.display = 'none';
                renderChannels(allChannels);
            } else {
                loadingDiv.innerText = "Error: API format change ho gaya hai.";
            }
        }

        function renderChannels(channelsToRender) {
            const onlineGrid = document.getElementById('online-grid');
            const offlineGrid = document.getElementById('offline-grid');
            const onlineTitle = document.getElementById('online-title');
            const offlineTitle = document.getElementById('offline-title');

            onlineGrid.innerHTML = '';
            offlineGrid.innerHTML = '';

            if(!Array.isArray(channelsToRender)) return;

            const onlineChannels = channelsToRender.filter(ch => ch.status && ch.status.toLowerCase() === 'online');
            const offlineChannels = channelsToRender.filter(ch => ch.status && ch.status.toLowerCase() === 'offline');

            onlineTitle.style.display = onlineChannels.length > 0 ? 'block' : 'none';
            offlineTitle.style.display = offlineChannels.length > 0 ? 'block' : 'none';

            onlineChannels.forEach(channel => {
                onlineGrid.appendChild(createChannelCard(channel));
            });

            offlineChannels.forEach(channel => {
                offlineGrid.appendChild(createChannelCard(channel));
            });
        }

        function createChannelCard(channel) {
            const div = document.createElement('div');
            div.className = 'channel-card';
            
            div.onclick = () => openPlayer(channel.url);

            const statusClass = channel.status && channel.status.toLowerCase() === 'online' ? 'status-online' : 'status-offline';
            const imgUrl = channel.image ? channel.image : 'https://via.placeholder.com/200x120?text=No+Image';
            const countryCode = channel.code ? channel.code.toUpperCase() : 'N/A';
            const viewersCount = channel.viewers !== undefined ? channel.viewers : 0;
            const statusText = channel.status ? channel.status : 'Unknown';

            div.innerHTML = `
                <img src="${imgUrl}" alt="${channel.name}" class="channel-image" onerror="this.src='https://via.placeholder.com/200x120?text=No+Image'">
                <div class="channel-name">${channel.name}</div>
                
                <div class="badges-container">
                    <span class="badge ${statusClass}">${statusText}</span>
                    <span class="badge country-badge">🌍 ${countryCode}</span>
                    <span class="badge viewers-badge">👁️ ${viewersCount}</span>
                </div>
            `;
            return div;
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredChannels = allChannels.filter(channel => 
                channel.name && channel.name.toLowerCase().includes(query)
            );
            renderChannels(filteredChannels);
        }

        function openPlayer(streamUrl) {
            history.pushState({ view: 'player' }, '', '#player');
            
            document.getElementById('main-view').style.display = 'none';
            const playerScreen = document.getElementById('player-screen');
            const iframe = document.getElementById('tv-player');
            
            playerScreen.style.display = 'block';
            iframe.src = streamUrl; 
        }

        function closePlayerUI() {
            document.getElementById('player-screen').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
            document.getElementById('tv-player').src = "";
        }
    </script>
</body>
</html>
